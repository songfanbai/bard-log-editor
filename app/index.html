<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'"><title>吟游诗人随手记·对话log编辑器</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="brand"><span class="mark" id="appIcon">♪</span><div><h1 id="appTitle">吟游诗人随手记·对话log编辑器</h1><p id="appSubtitle">你怎么知道我懒得整理RP记录。</p></div></div><div class="toolbar"><button id="importTxt">导入 TXT</button><button id="openProject">打开项目</button><button id="saveProject">保存项目</button><div class="exportControls"><label class="exportTitleField"><span class="toolbarLabel">导出标题</span><input id="exportTitle" type="text" placeholder="导出标题（可选）" title="导出标题；留空则不添加标题" aria-label="导出标题"></label><button id="exportWord" class="primary">导出 Word ↗</button></div></div></header>
<div class="statusbar"><span><i class="dot"></i>离线工作区</span><span id="saveStatus">尚未保存项目</span><div><button id="undo" class="quiet">↶ 撤销</button><button id="redo" class="quiet">↷ 重做</button><button id="customize" class="quiet">界面自定义</button><button id="help" class="quiet">使用帮助</button></div></div>
<main>
<section class="panel sourcePanel" id="sourcePanel"><div class="panelTitle"><h2><span>原始日志</span></h2><button id="sample" class="quiet">载入示例</button></div><textarea id="source" spellcheck="false" aria-label="原始日志" placeholder="[10:00]云舟静语庄园 : 今天天气很好。&#10;[10:02]云舟静语庄园整理好背包。"></textarea><div class="sourceFoot"><span id="draftStatus">等待输入</span><button id="parse" class="primary">解析日志</button></div><button id="pending" class="pendingButton">待确认 <strong id="pendingCount">0</strong><span>查看与修正 →</span></button></section>
<section class="previewPanel"><div class="previewTop"><div><h2><span>文档浏览</span></h2></div></div><div class="previewMetrics" aria-label="预览记录和页面信息"><span id="counts">还没有记录</span><span id="pageInfo">A4 · 连续预览</span><span class="pageMetric">页数 <span id="pagination" aria-live="polite"></span></span></div><div class="previewControls"><nav class="workspaceSwitch" aria-label="工作区面板"><button id="toggleSource" aria-expanded="true" aria-controls="sourcePanel">原始日志</button><button id="toggleSettings" aria-expanded="true" aria-controls="settingsPanel">角色与排版</button></nav><label class="pageSize">每页<select id="pageSize" aria-label="每页记录数"><option value="50">50 条</option><option value="100">100 条</option><option value="200" selected>200 条</option><option value="500">500 条</option></select></label></div><div class="pageTools"><div class="pager" aria-label="顶部翻页"><button id="prev">上一页</button><button id="next">下一页</button><label class="pageJump">跳至<input id="jumpTop" type="number" min="1" value="1" aria-label="顶部跳转页码"></label><button id="goTop">跳转</button></div></div><div class="paperWrap" id="paperWrap"><article class="paper" id="preview"><div class="empty"><span>“</span><h3>故事，从一句话开始</h3><p>拖动文件至此处导入txt，或将文本粘贴至原始日志。</p></div></article></div><p class="previewNote">预览分页可能与 Word 不同</p></section>
<aside class="panel settingsPanel" id="settingsPanel"><details id="layoutPane" class="resizePane" open><summary>常用设置</summary><div class="paneScroll" id="settingsScroll"><div class="typeFilters" id="typeFilters" aria-label="预览与导出类型"><label><input type="checkbox" id="filter-showDialogue" data-visibility="showDialogue" checked> 说话</label><label><input type="checkbox" id="filter-showParty" data-visibility="showParty" checked> 小队</label><label><input type="checkbox" id="filter-showAction" data-visibility="showAction" checked> 动作</label><label><input type="checkbox" id="filter-showShout" data-visibility="showShout" checked> 呼喊</label><label><input type="checkbox" id="filter-showYell" data-visibility="showYell" checked> 喊话</label><label><input type="checkbox" id="filter-showDice" data-visibility="showDice" checked> 掷骰</label></div><div id="settings"></div></div></details><details id="advanced" class="resizePane"><summary data-ui="advanced.title">高级设置</summary><div class="paneScroll" id="advancedScroll"><div id="advancedSettings"></div></div></details><details id="rolePane" class="resizePane" open><summary><span id="roleCount">0 个角色</span></summary><div class="paneScroll" id="rolesScroll"><div class="roleTools"><input id="roleSearch" type="search" placeholder="搜索角色或服务器" aria-label="搜索角色或服务器"><button id="autoColors" class="roleToolAction">自动配色</button><button id="knownRoles" class="roleToolAction" title="输入角色名或导入名单，帮助识别日志中的角色">手动添加角色</button></div><div class="roleItems"><div id="roleList"></div><button id="roleMore" hidden>显示更多角色</button></div></div></details><div class="configBar"><button id="saveConfig" title="保存角色显示名称、颜色及文档排版和显示设置，不包含日志">导出角色与排版</button><button id="loadConfig" title="导入角色名称、颜色及排版设置；可新增角色，不导入日志">导入角色与排版</button></div></aside>
</main><footer><span id="footerName">吟游诗人随手记·对话log编辑器</span> <span>RC 1.1.5-rc.8 · 本地文件 · 独立保存</span></footer>
<dialog id="modal"><div class="modalHead"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="关闭">×</button></div><div id="modalBody"></div></dialog><dialog id="uiDialog"><div class="modalHead"><h2>界面自定义</h2><button id="uiClose" aria-label="关闭界面自定义">×</button></div><div id="uiEditor"></div></dialog><div id="uiStorageNotice" hidden role="status"></div><div id="toast" role="status" aria-live="polite"></div>
<script src="core.js"></script><script src="fonts.js"></script><script src="app.js"></script><script src="customize.js"></script><script src="workspace.js"></script></body></html>
